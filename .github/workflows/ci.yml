name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Lint, build, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        # Non-blocking for now so a style warning doesn't block learning.
        # A real team would remove `continue-on-error` so lint failures block merges.
        run: npm run lint --prefix frontend
        continue-on-error: true

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Syntax-check backend entry point
        # `node --check` parses the file without executing it (no DB connection needed)
        run: node --check backend/server.js